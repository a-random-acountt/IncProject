name: Void
options:
  bundleIdPrefix: com.example.void
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  VoidCore:
    path: .
  ConfettiSwiftUI:
    url: https://github.com/simibac/ConfettiSwiftUI.git
    from: 1.1.0
  Shimmer:
    url: https://github.com/markiv/SwiftUI-Shimmer.git
    from: 1.5.1
  Pow:
    url: https://github.com/EmergeTools/Pow.git
    from: 1.0.4

targetTemplates:
  VoidApp:
    type: application
    sources:
      - path: Sources/Void
    resources:
      - path: Resources/Assets.xcassets
    dependencies:
      - package: VoidCore
      - package: ConfettiSwiftUI
      - package: Shimmer
      - package: Pow
    settings:
      base:
        PRODUCT_NAME: Void
        MARKETING_VERSION: "1.6.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Void
        CODE_SIGN_STYLE: Automatic

targets:
  Void-iOS:
    templates: [VoidApp]
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.void.ios
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"

  Void-macOS:
    templates: [VoidApp]
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.void.mac
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES

# No explicit `schemes:` block - XcodeGen generates one scheme per target
# (Void-iOS, Void-macOS) automatically. VoidCoreTests is a plain SPM test
# target (see Package.swift); run it with `swift test`, or add it to a
# scheme's Test action from within Xcode if you'd rather run it there.
